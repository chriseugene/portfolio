<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5efe7"/>

  <!-- Graph paper grid (subtle) -->
  <defs>
    <pattern id="grid-major" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(84,79,71,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="grid-minor" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(84,79,71,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid-minor)"/>
  <rect width="1200" height="630" fill="url(#grid-major)"/>

  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="#e75d0b"/>

  <!-- CE monogram badge -->
  <rect x="64" y="56" width="72" height="72" rx="16" fill="#e75d0b"/>
  <text x="100" y="104" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="white" letter-spacing="-1">CE</text>

  <!-- Name -->
  <text x="158" y="88" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="#544f47" letter-spacing="-1">CHRIS EUGENE</text>

  <!-- Tagline -->
  <text x="158" y="118" font-family="Georgia, serif" font-size="18" fill="#a89f95" letter-spacing="0.5">M.S. Electrical &amp; Computer Engineering · Saint Louis University</text>

  <!-- Divider -->
  <line x1="64" y1="152" x2="800" y2="152" stroke="rgba(84,79,71,0.12)" stroke-width="1.5"/>

  <!-- Main headline -->
  <text x="64" y="240" font-family="Arial Black, sans-serif" font-weight="900" font-size="62" fill="#544f47" letter-spacing="-2">Building Circuits,</text>
  <text x="64" y="314" font-family="Georgia, serif" font-style="italic" font-size="62" fill="#e75d0b" letter-spacing="-1">Systems &amp; Intelligent</text>
  <text x="64" y="388" font-family="Arial Black, sans-serif" font-weight="900" font-size="62" fill="#544f47" letter-spacing="-2">Machines.</text>

  <!-- Metrics row -->
  <rect x="64" y="436" width="148" height="72" rx="12" fill="white" stroke="rgba(84,79,71,0.10)" stroke-width="1.5"/>
  <text x="138" y="468" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="#e75d0b">3.90</text>
  <text x="138" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a89f95" letter-spacing="1">GPA · SLU</text>

  <rect x="228" y="436" width="148" height="72" rx="12" fill="white" stroke="rgba(84,79,71,0.10)" stroke-width="1.5"/>
  <text x="302" y="468" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="#e75d0b">5+</text>
  <text x="302" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a89f95" letter-spacing="1">PROJECTS</text>

  <rect x="392" y="436" width="148" height="72" rx="12" fill="white" stroke="rgba(84,79,71,0.10)" stroke-width="1.5"/>
  <text x="466" y="468" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="#e75d0b">3</text>
  <text x="466" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a89f95" letter-spacing="1">COMPANIES</text>

  <!-- URL -->
  <text x="64" y="584" font-family="Georgia, serif" font-size="20" fill="#e75d0b" letter-spacing="1">eugenechris.com</text>

  <!-- Right side: skill tags -->
  <rect x="900" y="180" width="220" height="40" rx="20" fill="#e75d0b" opacity="0.12"/>
  <text x="1010" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e75d0b" font-weight="700">Machine Learning</text>

  <rect x="860" y="238" width="260" height="40" rx="20" fill="rgba(81,125,100,0.12)"/>
  <text x="990" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#517d64" font-weight="700">Nanofabrication &amp; CVD</text>

  <rect x="920" y="296" width="200" height="40" rx="20" fill="rgba(59,130,246,0.10)"/>
  <text x="1020" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" font-weight="700">Power Systems</text>

  <rect x="875" y="354" width="245" height="40" rx="20" fill="rgba(124,58,237,0.10)"/>
  <text x="997" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" font-weight="700">Optical Communications</text>

  <rect x="910" y="412" width="210" height="40" rx="20" fill="rgba(231,93,11,0.08)"/>
  <text x="1015" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e75d0b" font-weight="700">Embedded Systems</text>

  <rect x="880" y="470" width="240" height="40" rx="20" fill="rgba(81,125,100,0.08)"/>
  <text x="1000" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#517d64" font-weight="700">TensorFlow · OpenCV</text>
</svg>
