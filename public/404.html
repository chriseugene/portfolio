<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Chris Eugene</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bricolage+Grotesque:opsz,wght@10..40,700;10..40,900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background-color: #f5efe7;
      background-image:
        linear-gradient(rgba(84,79,71,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(84,79,71,0.035) 1px, transparent 1px),
        linear-gradient(rgba(84,79,71,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(84,79,71,0.018) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bricolage Grotesque', sans-serif;
      color: #544f47;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(80px, 18vw, 140px);
      font-weight: 700;
      color: #e75d0b;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -4px;
    }
    .label {
      font-family: 'Architects Daughter', cursive;
      font-size: 18px;
      color: #e75d0b;
      margin-bottom: 20px;
      display: inline-block;
      transform: rotate(-1.5deg);
    }
    h1 {
      font-weight: 900;
      font-size: clamp(22px, 4vw, 34px);
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      color: #544f47;
    }
    p {
      font-size: 15px;
      color: #7d776e;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 32px;
      border-radius: 100px;
      background: #e75d0b;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(231,93,11,0.30);
      letter-spacing: 0.01em;
      transition: opacity 0.18s, transform 0.18s;
    }
    .btn:hover { opacity: 0.88; transform: scale(1.03); }
    .note {
      margin-top: 28px;
      font-family: 'Architects Daughter', cursive;
      font-size: 13px;
      color: #b0a99e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <p class="label">oops, wrong turn 🗺️</p>
    <h1>Page Not Found</h1>
    <p>
      This page doesn't exist — maybe it was moved, deleted, or you typed the URL wrong.
      Either way, there's nothing here to circuit-trace.
    </p>
    <a href="/" class="btn">← Back to Portfolio</a>
    <p class="note">eugenechris.com</p>
  </div>
</body>
</html>
